<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Real-time NSE Option Chain OI Analysis">
    <title>Option Chain Tracker - NSE Live</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main App Screen -->
    <div id="appScreen" class="screen active">
        <!-- Header -->
        <header class="app-header">
            <div class="header-top">
                <h2 id="symbolName">NIFTY</h2>
                <div class="spot-price" id="spotPrice">Loading...</div>
            </div>
            
            <div class="header-controls">
                <div class="symbol-buttons">
                    <button class="btn-symbol active" data-symbol="NIFTY">NIFTY</button>
                    <button class="btn-symbol" data-symbol="BANKNIFTY">BANKNIFTY</button>
                </div>
                
                <div class="timeframe-selector">
                    <label>Timeframe:</label>
                    <select id="timeframeSelect">
                        <option value="30s">30 Sec</option>
                        <option value="1m" selected>1 Min</option>
                        <option value="2m">2 Min</option>
                        <option value="3m">3 Min</option>
                        <option value="5m">5 Min</option>
                        <option value="10m">10 Min</option>
                        <option value="15m">15 Min</option>
                        <option value="30m">30 Min</option>
                        <option value="1h">1 Hour</option>
                        <option value="2h">2 Hour</option>
                        <option value="4h">4 Hour</option>
                        <option value="1d">1 Day</option>
                    </select>
                </div>
                
                <div class="auto-refresh">
                    <label>
                        <input type="checkbox" id="autoRefresh" checked>
                        Auto (5s)
                    </label>
                </div>
            </div>
            
            <div class="status-bar">
                <span id="statusMsg">Initializing...</span>
                <span id="lastUpdate"></span>
            </div>
        </header>

        <!-- Option Chain Data -->
        <div class="option-chain-container">
            <div class="table-header">
                <div class="header-ce">CALLS</div>
                <div class="header-strike">STRIKE</div>
                <div class="header-pe">PUTS</div>
            </div>
            
            <div id="optionChainData" class="option-chain-data">
                <!-- Data will be inserted here dynamically -->
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loader" class="loader hidden">
            <div class="spinner"></div>
            <p>Loading NSE data...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
